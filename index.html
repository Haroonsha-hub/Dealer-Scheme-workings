<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dealer Scheme Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: charcoal header with a four-colour ribbon, airy pale ground, white cards; colour is used as small signals (KPI tops, slab swatches, the diary countdown). */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --sunk:#F2F1F6; --ink:#2B2A28; --muted:#6B6875; --line:#E3E1EA;
  --accent:#5B4FA8; --accent-ink:#FFFFFF; --accent-soft:#EEECF8;
  --band:#2B2A28; --band-ink:#FFFFFF; --sun:#FFCE00; --sun-ink:#2B2A28; --sun-soft:#FFF7D6;
  --plum:#5B4FA8; --plum-ink:#FFFFFF; --plum-soft:#EEECF8; --berry:#EE7F1D; --leaf:#009B48;
  --good:#0E7F42; --good-soft:#E0F3E8; --warn:#A35A00; --warn-soft:#FDEEDC; --bad:#C2392F; --bad-soft:#FBE3E0;
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121116; --surface:#1B1A21; --sunk:#16151B; --ink:#ECEAF2; --muted:#A19DAE; --line:#2C2A35;
  --accent:#A99DF2; --accent-ink:#17132E; --accent-soft:#252140;
  --band:#0D0C10; --band-ink:#FFFFFF; --sun:#FFD43B; --sun-ink:#2B2A28; --sun-soft:#2E2914;
  --plum:#A99DF2; --plum-ink:#17132E; --plum-soft:#252140; --berry:#FF9A45; --leaf:#3CCB7C;
  --good:#52C68C; --good-soft:#15301F; --warn:#F2B44C; --warn-soft:#33270F; --bad:#FF7B72; --bad-soft:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121116; --surface:#1B1A21; --sunk:#16151B; --ink:#ECEAF2; --muted:#A19DAE; --line:#2C2A35;
  --accent:#A99DF2; --accent-ink:#17132E; --accent-soft:#252140;
  --band:#0D0C10; --band-ink:#FFFFFF; --sun:#FFD43B; --sun-ink:#2B2A28; --sun-soft:#2E2914;
  --plum:#A99DF2; --plum-ink:#17132E; --plum-soft:#252140; --berry:#FF9A45; --leaf:#3CCB7C;
  --good:#52C68C; --good-soft:#15301F; --warn:#F2B44C; --warn-soft:#33270F; --bad:#FF7B72; --bad-soft:#3A1A18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);border-bottom:0}
.top::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--leaf) 0 25%,var(--sun) 25% 50%,var(--plum) 50% 75%,var(--berry) 75%)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.fan{display:flex;gap:2px}
.fan i{display:block;width:7px;height:24px;border-radius:3px}
.fan i:nth-child(1){background:#2FB36A}.fan i:nth-child(2){background:var(--sun)}.fan i:nth-child(3){background:#7B5BD6}.fan i:nth-child(4){background:#F0524A}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.month{display:flex;flex-direction:column;line-height:1.2}
.month b{font-size:13px}
.month span{font-size:12px;opacity:.8}
.month b{color:var(--sun)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.top .btn.primary{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.btn{border-radius:999px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* selector */
.pick{padding-block:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.4fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field select,.field input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px}
.results{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .14);z-index:4;overflow:hidden}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.on{background:var(--accent-soft)}
.results small{color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom:3px solid var(--accent)}

main{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}

/* dealer head */
.dhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.dhead h2{font-size:clamp(26px,3.6vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.dhead .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.kpi{position:relative;overflow:hidden;padding-left:18px}.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0}
.kpi:nth-child(1)::before{background:var(--leaf)}.kpi:nth-child(2)::before{background:var(--sun)}.kpi:nth-child(3)::before{background:var(--plum)}.kpi:nth-child(4)::before{background:var(--berry)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.win{border:1px solid var(--line);background:var(--sun-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.win .t{font-size:12px;font-weight:700;color:var(--muted)}
.win .b{font-weight:700}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h3{font-size:19px;font-weight:700;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:0 1px 2px rgb(40 30 80 / .04)}
.card>header{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card>header h4{margin:0;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.card>header .p{font-size:12px;color:var(--muted)}
.part{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.part:last-of-type{border-bottom:0}
.part .ph{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.part .ph b{font-size:13px}
.basis{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.basis small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.line{font-size:13px}
.line .lab{display:inline-block;min-width:70px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* shade card ladder */
.ladder{display:flex;gap:3px;overflow-x:auto;padding:8px 1px 2px}
.sw{flex:1 0 58px;border-radius:6px;padding:6px 6px 5px;min-height:46px;display:flex;flex-direction:column;justify-content:space-between;position:relative;border:1px solid transparent;color:var(--ink)}
.sw .m{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.sw .r{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.sw.off{opacity:.42}
.sw.cur{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.sw.nx{border:1px dashed var(--ink);opacity:.8}
.sw .tag{position:absolute;top:-8px;right:4px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--plum);color:var(--plum-ink);padding:1px 5px;border-radius:4px}
.sw.deep{color:var(--accent-ink)}
.bar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.gates{display:flex;flex-wrap:wrap;gap:6px}
details.raw{border-top:1px solid var(--line)}
details.raw summary{padding:9px 14px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:0 14px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}

.idle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.idle div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.idle div:last-child{border-bottom:0}
.idle span:last-child{color:var(--muted);text-align:right}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* slab book */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.book .card table th,.book .card table td{padding:6px 12px}

/* empty + panels */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{font-size:22px}
.empty p{margin:0;max-width:52ch;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:20px}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.drop{position:relative;display:block;border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;background:var(--sunk);cursor:pointer}
.drop .pick-btn{display:inline-block;margin-top:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:10px 20px;font-size:15px}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
.alt-pick{display:flex;flex-direction:column;gap:6px;font-size:13px}
.alt-pick input[type=file]{font-size:14px;max-width:100%}
.help{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.help b{color:var(--ink)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stats div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-family:var(--display);font-size:24px;font-weight:700;color:var(--accent)}
.msg{font-size:13px;padding:8px 10px;border-radius:8px}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:var(--warn-soft);color:var(--warn)}
textarea{width:100%;min-height:340px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px}
ul.plain{margin:0;padding-left:18px}

/* highlight scheme banner */
.promo{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:18px 20px;position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;right:-60px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:var(--sun);opacity:.18}
.cal{width:96px;background:var(--sun);border-radius:16px;overflow:hidden;text-align:center;color:var(--sun-ink);flex:none}
.cal::before{content:"";display:block;height:10px;background:var(--band)}
.cal b{display:block;font-family:var(--display);font-size:46px;font-weight:800;line-height:1;padding-top:6px}
.cal span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 0 9px}
.promo h3{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.promo .sub{font-size:13px;color:var(--muted);margin-top:4px}
.promo .me{margin-top:10px;background:var(--plum-soft);border-radius:10px;padding:8px 10px;font-size:13px}
.promo .me b{color:var(--accent)}
.dslabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;position:relative;z-index:1}
.dslabs div{background:var(--sunk);border-radius:12px;padding:6px 8px;text-align:center;border:2px solid transparent}
.dslabs div.on{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.dslabs div.nx{border:2px dashed var(--accent)}
.dslabs small{display:block;font-size:11px;color:var(--muted)}
.dslabs div.on small{color:var(--sun-ink)}
.dslabs b{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
@media (max-width:860px){.promo{grid-template-columns:auto minmax(0,1fr)}.dslabs{grid-column:1/-1}}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.pick{grid-template-columns:minmax(0,1fr)}.month{display:none}.brand h1{font-size:17px;white-space:normal;line-height:1.15}.top .btn.primary{padding:7px 12px;flex:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* data stamp strip */
.stampbar{background:var(--surface);border-bottom:1px solid var(--line)}
.stamp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px;font-size:13px}
.stamp .dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:none}
.stamp .dot.stale{background:var(--berry)}
.stamp b{font-weight:700}
.stamp .grow{flex:1}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 4px;font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Birla Opus Dealer Scheme Dashboard</h1></div>
    <div class="month" id="monthInfo"><b>Loading…</b><span>Fetching the latest scheme working</span></div>
    <button class="btn primary" id="uploadBtn" hidden>Upload working</button>
  </div>
</header>

<div class="stampbar"><div class="wrap stamp" id="stamp" aria-live="polite"><span class="dot"></span><span>Loading data…</span></div></div>

<div class="wrap">
  <div class="pick">
    <div class="field"><label for="tsm">TSM</label><select id="tsm"><option value="">All TSMs</option></select></div>
    <div class="field"><label for="dealer">Dealer</label><select id="dealer"><option value="">Select a dealer</option></select></div>
    <div class="field"><label for="q">Search dealer</label><input id="q" type="search" placeholder="Dealer name or parent code" autocomplete="off"><div class="results" id="results" hidden></div></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-dealer" data-tab="dealer" aria-selected="true">Dealer dashboard</button>
    <button role="tab" id="tab-push" data-tab="push" aria-selected="false">Next-slab push list</button>
    <button role="tab" id="tab-book" data-tab="book" aria-selected="false">Slab book</button>
  </nav>
</div>

<main class="wrap" id="main">
  <div class="empty"><h3>Loading scheme working…</h3><p>Dealer dashboards appear here once the latest file loads.</p></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

/* Scheme-working workbook parser. Pure: takes the SheetJS global and a workbook. */
var SchemeParser = (function () {
  function norm(s) {
    return String(s == null ? "" : s).replace(/[\s ]+/g, " ").trim().toLowerCase();
  }
  function clean(s) {
    return String(s == null ? "" : s).replace(/[\s ]+/g, " ").trim();
  }
  var IDENT = { "asm name": "a", "tsm name": "t", "tty": "y", "parent": "c", "parent code": "c", "parent name": "n" };

  function parseWorkbook(XLSX, wb) {
    var groups = [];          // {key, title, sheet, cols:[globalIndex]}
    var cols = [];            // {g: groupIndex, h: header}
    var dealers = {};         // code -> {c,n,t,y,a,v:{}}
    var order = [];
    var warnings = [];
    var errorCells = 0;

    wb.SheetNames.forEach(function (sheetName) {
      var ws = wb.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
      var h = -1;
      for (var i = 0; i < Math.min(rows.length, 15); i++) {
        if ((rows[i] || []).some(function (v) { return norm(v) === "parent name"; })) { h = i; break; }
      }
      if (h < 0) return;
      var head = rows[h] || [];
      var top = h > 0 ? rows[h - 1] || [] : [];
      var isOtc = /otc/i.test(sheetName);
      var prefix = isOtc ? "OTC · " : "";
      var identIdx = {};
      var width = Math.max(head.length, top.length);
      var curTitle = null;
      var localCols = []; // [colIndexInSheet, globalIndex]
      var groupByTitle = {};
      for (var c = 0; c < width; c++) {
        var hv = norm(head[c]);
        if (top[c] != null && clean(top[c]) !== "") curTitle = clean(top[c]);
        if (IDENT[hv] && identIdx[IDENT[hv]] == null && curTitle == null) { identIdx[IDENT[hv]] = c; continue; }
        if (!hv) continue;
        var title = curTitle == null ? (isOtc ? "Overall" : "Overall") : curTitle;
        var key = prefix + title;
        var gi = groupByTitle[key];
        if (gi == null) {
          gi = groups.length;
          groupByTitle[key] = gi;
          groups.push({ key: key, title: title, sheet: sheetName, otc: isOtc, cols: [] });
        }
        var g = cols.length;
        cols.push({ g: gi, h: clean(head[c]) });
        groups[gi].cols.push(g);
        localCols.push([c, g]);
      }
      if (identIdx.n == null || identIdx.c == null) { warnings.push("Sheet \"" + sheetName + "\" skipped: no Parent / Parent Name column."); return; }
      for (var r = h + 1; r < rows.length; r++) {
        var row = rows[r] || [];
        var name = clean(row[identIdx.n]);
        var code = clean(row[identIdx.c]);
        if (!name || !code) continue;
        var d = dealers[code];
        if (!d) {
          d = dealers[code] = { c: code, n: name, t: "", y: "", a: "", v: {} };
          order.push(code);
        }
        if (identIdx.t != null && clean(row[identIdx.t])) d.t = d.t || clean(row[identIdx.t]);
        if (identIdx.y != null && clean(row[identIdx.y])) d.y = d.y || clean(row[identIdx.y]);
        if (identIdx.a != null && clean(row[identIdx.a])) d.a = d.a || clean(row[identIdx.a]);
        if (!isOtc) d.n = name; // prefer scheme sheet spelling
        localCols.forEach(function (pair) {
          var v = row[pair[0]];
          if (v == null || v === "") return;
          if (typeof v === "string") {
            var s = v.trim();
            if (/^#/.test(s)) { errorCells++; return; }
            var num = Number(s.replace(/,/g, ""));
            if (s !== "" && !isNaN(num)) v = num; else v = s;
          } else if (typeof v === "boolean") {
            v = v ? 1 : 0;
          } else if (typeof v === "number" && !isFinite(v)) {
            errorCells++; return;
          }
          if (typeof v === "number") {
            if (v === 0) return;
            v = Math.round(v * 10000) / 10000;
          }
          d.v[pair[1]] = v;
        });
      }
    });

    if (!order.length) throw new Error("No dealer rows found. The file needs a header row with \"Parent\" and \"Parent Name\" columns.");
    if (errorCells) warnings.push(errorCells + " cells had Excel errors (like #VALUE!) and were treated as blank.");

    // mark groups that are empty for every dealer
    var used = {};
    order.forEach(function (code) { Object.keys(dealers[code].v).forEach(function (k) { used[cols[k].g] = true; }); });
    groups.forEach(function (g, i) { g.empty = !used[i]; });

    var list = order.map(function (code) {
      var d = dealers[code];
      var v = [];
      Object.keys(d.v).forEach(function (k) { v.push([Number(k), d.v[k]]); });
      return { c: d.c, n: d.n, t: d.t || "Unassigned", y: d.y, a: d.a, v: v };
    });
    var tsms = {};
    list.forEach(function (d) { tsms[d.t] = (tsms[d.t] || 0) + 1; });
    return { groups: groups, cols: cols, dealers: list, tsms: tsms, warnings: warnings };
  }
  return { parseWorkbook: parseWorkbook, norm: norm };
})();

/* Slab engine: works out qualified benefit and next slab per scheme part. Pure. */
var SlabEngine = (function () {
  function norm(s) { return String(s == null ? "" : s).replace(/[\s ]+/g, " ").trim().toLowerCase(); }
  function num(v) { return typeof v === "number" && isFinite(v) ? v : 0; }
  function asList(x) { return x == null ? [] : Array.isArray(x) ? x : [x]; }

  function makeGetter(meta, group, vmap) {
    var occ = {};
    group.cols.forEach(function (gi) {
      var k = norm(meta.cols[gi].h);
      (occ[k] = occ[k] || []).push(gi);
    });
    function idxOf(ref) {
      var m = /^(.*)#(\d+)$/.exec(ref);
      var name = norm(m ? m[1] : ref), n = m ? Number(m[2]) : 1;
      var arr = occ[name];
      return arr && arr[n - 1] != null ? arr[n - 1] : null;

      has: function (ref) { return idxOf(ref) != null; },
      raw: function (ref) { var i = idxOf(ref); return i == null ? undefined : vmap[i]; },
      num: function (ref) { var i = idxOf(ref); return i == null ? 0 : num(vmap[i]); }
    };
  }

  function rateOf(s) {
    if (!s) return null;
    if (s.pct != null) return { kind: "pct", v: s.pct };
    if (s.amt != null) return { kind: "amt", v: s.amt };
    if (s.perUnit != null) return { kind: "perUnit", v: s.perUnit };
    if (s.gift != null) return { kind: "gift", v: s.gift };
    return null;
  }

  function analyzeEvery(e, b, unit) {
    var size = e.size, base = Math.max(b, 0);
    var count = Math.floor(base / size + 1e-9);
    var need = size - (base - count * size);
    return {
      type: "every", size: size, count: count,
      amt: e.amt != null ? count * e.amt : null,
      gift: e.gift != null && count > 0 ? (count > 1 ? count + " × " : "") + e.gift : null,
      perAmt: e.amt, perGift: e.gift,
      need: need, nextMin: (count + 1) * size,
      ratio: need / size,
      label: e.label || null, unit: unit

  function analyzePart(p, get) {
    var unit = p.unit || "L";
    var b = 0;
    asList(p.basis).forEach(function (ref) { b += get.num(ref); });
    b = Math.round(b * 100) / 100;
    var res = { label: p.label || "", unit: unit, basis: b, period: p.period || "", note: p.note || "", state: b > 0 ? "in" : "none" };

    if (p.gates) {

        var v = 0; asList(gt.col).forEach(function (r) { v += get.num(r); });
        return { label: gt.label, min: gt.min, val: Math.round(v * 100) / 100, ok: v >= gt.min };
      });
    }
    if (p.giftCol) {
      var gv = get.raw(p.giftCol);

      res.qualifiedAmt = e.amt; res.qualifiedGift = e.gift;
      var cnE = p.cnCol ? get.num(p.cnCol) : 0;

    var slabs = (p.slabs || []).slice().sort(function (x, y) { return x.min - y.min; });

      }

    res.rate = rateOf(cur);
    if (excelPct > 0 && (!res.rate || res.rate.kind !== "pct" || excelPct > res.rate.v + 1e-9)) {
      res.rate = { kind: "pct", v: excelPct }; res.byWorking = true;
    }

    var cn = p.cnCol ? get.num(p.cnCol) : 0;
    if (cn) res.workingAmt = cn;

    var value = p.valueCol ? get.num(p.valueCol) : (unit === "₹" ? b : 0);
    var vpu = null;
    if (unit === "₹") vpu = 1;

      if (b >= next.min) { n.need = 0; n.shadeNeed = (next.shades || 0) - (shades || 0); }

      if (nr) {
        if (nr.kind === "pct") n.est = vpu ? nr.v * next.min * vpu : null;
        else if (nr.kind === "amt") n.est = nr.v;
        else if (nr.kind === "perUnit") n.est = nr.v * next.min;
        else if (nr.kind === "gift") n.gift = nr.v;

      n.approx = unit !== "₹" && nr && nr.kind === "pct";
      res.next = n;
      res.ratio = next.min > 0 ? n.need / next.min : 1;
      if (n.need === 0 && n.shadeNeed > 0) res.ratio = 0.01;
    } else if (cur) {
      res.state = "top";
    }
    if (b > 0 && idx < 0) res.state = "below";
    if (b <= 0) res.state = "none";

    if (p.extra) {
      res.extra = analyzeEvery(p.extra, b, unit);
    }
    return res;
  }

  function findCfg(config, group) {
    if (!config || !config.schemes) return null;
    var k = norm(group.key);
    for (var i = 0; i < config.schemes.length; i++) {
      if (norm(config.schemes[i].group) === k) return config.schemes[i];
    }

  }

  function analyzeDealer(meta, dealer, config, today) {
    var vmap = {};
    dealer.v.forEach(function (pair) { vmap[pair[0]] = pair[1]; });
    var out = { groups: [], gsr: null, cnTotal: 0, gifts: [], near: 0 };

  function readFile(file){
    S.upMsg=null;
    var nm=file.name||""; if(/\.[a-z0-9]{2,5}$/i.test(nm) && !/\.(xlsx|xlsm|xls|xlsb)$/i.test(nm) && !/sheet|excel/i.test(file.type||"")){ S.upMsg=["err","“"+(file.name||"This file")+"” is not an Excel file. Choose the scheme-working .xlsx file."]; render(); return; }
    if(typeof XLSX==="undefined"){ S.upMsg=["err","The Excel reader did not load. Check your internet connection and reload the page."]; render(); return; }
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(fr.result),{type:"array"});
        var parsed=SchemeParser.parseWorkbook(XLSX,wb);
        S.meta={ month:(S.config&&S.config.month)||"", fileName:file.name,
          fileModified: file.lastModified ? new Date(file.lastModified).toISOString() : null,
          uploadedAt:new Date().toISOString(), groups:parsed.groups, cols:parsed.cols, dealers:parsed.dealers };
        if(S.tsm && !S.meta.dealers.some(function(d){ return d.t===S.tsm; })) S.tsm="";
        if(S.dealer && !findDealer(S.dealer)) S.dealer="";
        var saved=true; try{ localStorage.setItem(STORE_KEY, JSON.stringify(S.meta)); }catch(e){ saved=false; }
        S.showUpload=false; S.upMsg=null;
        S.flash=["ok","Loaded "+file.name+": "+parsed.dealers.length+" dealers, "+Object.keys(parsed.tsms).length+" TSMs."+(saved?"":" This browser could not remember it, so upload it again next time.")+(parsed.warnings.length?" "+parsed.warnings.join(" "):"")];
      }catch(e){ S.upMsg=["err","Could not read this file: "+(e.message||e)]; }
      render();
    };
    fr.onerror=function(){ S.upMsg=["err","Could not open the file. Try saving it again from Excel."]; render(); };
    fr.readAsArrayBuffer(file);
  }
  function restore(){
    try{ var t=localStorage.getItem(STORE_KEY); if(t){ var m=JSON.parse(t); if(m && Array.isArray(m.dealers)) S.meta=m; } }catch(e){}
    S.loaded.data=true;
  }
  function loadSlabs(){ S.config = window.SLABS || null; S.loaded.cfg=true; }

  /* ---------- search ---------- */
  var hits=[], hi=-1;
  function showResults(){
    var q=$("q").value.trim().toLowerCase(), box=$("results");
    if(!q){ box.hidden=true; hits=[]; return; }
    hits=dealers().filter(function(d){ return d.n.toLowerCase().indexOf(q)>=0 || d.c.indexOf(q)>=0; })
      .sort(function(a,b){ var A=a.n.toLowerCase().indexOf(q)===0?0:1, B=b.n.toLowerCase().indexOf(q)===0?0:1; return A-B || a.n.localeCompare(b.n); }).slice(0,8);
    hi=hits.length?0:-1;
    box.innerHTML = hits.length ? hits.map(function(d,i){ return '<button type="button" data-hit="'+esc(d.c)+'" class="'+(i===hi?"on":"")+'"><span>'+esc(d.n)+'</span><small>'+esc(d.t)+' · '+esc(d.c)+'</small></button>'; }).join("") : '<button type="button" disabled><span class="muted">No dealer matches “'+esc(q)+'”</span></button>';
    box.hidden=false;
  }
  function openDealer(code){
    var d=findDealer(code); if(!d) return;
    if(S.tsm && d.t!==S.tsm){ S.tsm=d.t; ls("sp.tsm",S.tsm); }
    S.dealer=code; S.tab="dealer"; $("q").value=""; $("results").hidden=true; render(); window.scrollTo({top:0});
  }

  /* ---------- events ---------- */
  $("tsm").addEventListener("change",function(e){ S.tsm=e.target.value; ls("sp.tsm",S.tsm); var d=findDealer(S.dealer); if(d && S.tsm && d.t!==S.tsm) S.dealer=""; render(); });
  $("dealer").addEventListener("change",function(e){ S.dealer=e.target.value; S.tab="dealer"; render(); });
  $("q").addEventListener("input",showResults);
  $("q").addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!hits.length) return; hi=(hi+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length; document.querySelectorAll("#results button").forEach(function(b,i){ b.classList.toggle("on",i===hi); }); }
    else if(e.key==="Enter"&&hits[hi]){ e.preventDefault(); openDealer(hits[hi].c); }
    else if(e.key==="Escape"){ $("results").hidden=true; }
  });
  $("results").addEventListener("mousedown",function(e){ var b=e.target.closest("[data-hit]"); if(b){ e.preventDefault(); openDealer(b.dataset.hit); } });
  $("q").addEventListener("blur",function(){ setTimeout(function(){ $("results").hidden=true; },150); });
  document.querySelector(".tabs").addEventListener("click",function(e){ var b=e.target.closest("[data-tab]"); if(b){ S.tab=b.dataset.tab; render(); } });
  $("uploadBtn").addEventListener("click",function(){ S.showUpload=!S.showUpload; S.upMsg=null; S.flash=null; render(); });
  $("stamp").addEventListener("click",function(e){ var b=e.target.closest("[data-act]"); if(!b) return;
    if(b.dataset.act==="openup"){ S.showUpload=true; S.upMsg=null; S.flash=null; render(); }
    if(b.dataset.act==="forget"){ try{ localStorage.removeItem(STORE_KEY); }catch(er){} S.meta=null; S.dealer=""; S.flash=null; render(); } });
  $("main").addEventListener("click",function(e){
    var r=e.target.closest("[data-dealer]"); if(r){ openDealer(r.dataset.dealer); return; }
    var p=e.target.closest("[data-push]"); if(p){ S.push=p.dataset.push; render(); return; }
    var a=e.target.closest("[data-act]"); if(!a) return;
    var act=a.dataset.act;
    if(act==="openup"){ S.showUpload=true; S.upMsg=null; render(); window.scrollTo({top:0}); }
  });

  /* ---------- boot ---------- */
  S.tsm = ls("sp.tsm") || "";
  render();
  loadSlabs(); restore();
  render();
})();
</script>
</body>
</html>
